
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary XOR</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #818cf8;
        }

        label {
            display: block;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 20px;
            direction: ltr;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            text-align: center;
            direction: ltr;
            font-family: monospace;
            font-size: 26px;
            overflow-wrap: anywhere;
        }

        #message {
            color: #f87171;
            margin-top: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Binary XOR</h2>

        <label for="binaryText">النص الثنائي (Binary Text):</label>
        <input
            id="binaryText"
            type="text"
            placeholder="مثال: 01"
            inputmode="numeric"
            autocomplete="off"
        >

        <label for="binaryKey">المفتاح الثنائي (Binary Key):</label>
        <input
            id="binaryKey"
            type="text"
            placeholder="مثال: 11"
            inputmode="numeric"
            autocomplete="off"
        >

        <button onclick="calculateXOR()">احسب XOR</button>

        <label>النتيجة الثنائية (Binary Result):</label>
        <div class="result" id="result">---</div>
        <div id="message"></div>
    </div>

    <script>
        function calculateXOR() {
            const text = document.getElementById("binaryText").value.trim();
            const key = document.getElementById("binaryKey").value.trim();
            const resultBox = document.getElementById("result");
            const message = document.getElementById("message");

            message.textContent = "";
            resultBox.textContent = "---";

            if (!text || !key) {
                message.textContent = "أدخل النص الثنائي والمفتاح.";
                return;
            }

            if (!/^[01]+$/.test(text) || !/^[01]+$/.test(key)) {
                message.textContent = "يُسمح باستخدام 0 و1 فقط.";
                return;
            }

            if (text.length !== key.length) {
                message.textContent =
                    "يجب أن يكون طول النص والمفتاح متساويًا.";
                return;
            }

            let result = "";

            for (let i = 0; i < text.length; i++) {
                result += text[i] === key[i] ? "0" : "1";
            }

            resultBox.textContent = result;
        }
    </script>
</body>
</html>
